<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Monitoramento de Ruído</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <h1>Dashboard de Monitoramento de Ruído Industrial</h1>
    <p>Monitoramento em tempo real</p>
</header>

<main>
    <section class="cards">
        <div class="card destaque">
            <h2>Nível Atual</h2>
            <p id="nivelAtual">-- dB</p>
            <span id="statusAtual">Aguardando dados...</span>
        </div>

        <div class="card">
            <h2>Média Recente</h2>
            <p id="media">-- dB</p>
        </div>

        <div class="card">
            <h2>Pico Registrado</h2>
            <p id="pico">-- dB</p>
        </div>

        <div class="card">
            <h2>Última Atualização</h2>
            <p id="ultimaAtualizacao">--</p>
        </div>
    </section>

    <section class="painel">
        <h2>Histórico Recente</h2>

        <button onclick="conectarESP32()" class="botao-excel">
            Conectar ESP32 via USB
        </button>

        <button onclick="exportarExcel()" class="botao-excel">
    Gerar Relatório Excel
</button>

        <div class="grafico" id="grafico"></div>

        <table>
            <thead>
                <tr>
                    <th>Horário</th>
                    <th>Operador</th>
                    <th>Decibéis</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabelaDados">
                <tr>
                    <td colspan="4">Aguardando leituras...</td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

<script>
let leiturasSerial = [];

function classificarStatus(db) {
    if (db >= 95) return ["Crítico", "critico"];
    if (db >= 90) return ["Alerta", "alerta"];
    if (db >= 85) return ["Atenção", "atencao"];
    return ["Normal", "normal"];
}

function atualizarDashboard(dados) {
    if (dados.length === 0) return;

    const ultima = dados[0];
    const valores = dados.map(item => item.decibeis);

    document.getElementById("nivelAtual").innerText = ultima.decibeis.toFixed(1) + " dB";
    document.getElementById("ultimaAtualizacao").innerText = ultima.data_hora;

    const media = valores.reduce((a, b) => a + b, 0) / valores.length;
    const pico = Math.max(...valores);

    document.getElementById("media").innerText = media.toFixed(1) + " dB";
    document.getElementById("pico").innerText = pico.toFixed(1) + " dB";

    const status = document.getElementById("statusAtual");
    const [texto, classe] = classificarStatus(ultima.decibeis);

    if (classe === "critico") {
        status.innerText = "ALERTA CRÍTICO: exposição elevada";
    } else if (classe === "alerta") {
        status.innerText = "ALERTA: nível acima do recomendado";
    } else if (classe === "atencao") {
        status.innerText = "ATENÇÃO: nível próximo ao limite";
    } else {
        status.innerText = "Nível dentro da faixa monitorada";
    }

    status.className = classe;

    atualizarTabela(dados);
    atualizarGrafico(dados);
}

async function carregarDados() {
    try {
        const resposta = await fetch("/api/ultimas");
        const dados = await resposta.json();

        if (!Array.isArray(dados) || dados.length === 0) return;

        atualizarDashboard(dados);

    } catch (erro) {
        console.error("Erro ao carregar dados:", erro);
    }
}

function atualizarTabela(dados) {
    const tabela = document.getElementById("tabelaDados");
    tabela.innerHTML = "";

    dados.forEach(item => {
        const [texto, classe] = classificarStatus(item.decibeis);

        tabela.innerHTML += `
            <tr>
                <td>${item.data_hora}</td>
                <td>Operador ${item.operador}</td>
                <td>${item.decibeis.toFixed(1)} dB</td>
                <td><span class="badge ${classe}">${texto}</span></td>
            </tr>
        `;
    });
}

function atualizarGrafico(dados) {
    const grafico = document.getElementById("grafico");
    grafico.innerHTML = "";

    const dadosInvertidos = [...dados].reverse();

    dadosInvertidos.forEach(item => {
        const altura = Math.min(item.decibeis, 110);
        const [texto, classe] = classificarStatus(item.decibeis);

        grafico.innerHTML += `
            <div class="barra-container">
                <div class="barra ${classe}" style="height:${altura * 2}px" title="${item.decibeis.toFixed(1)} dB"></div>
                <small>${item.decibeis.toFixed(0)}</small>
            </div>
        `;
    });
}

async function conectarESP32() {
    if (!("serial" in navigator)) {
        alert("Seu navegador não suporta Web Serial. Use Google Chrome ou Microsoft Edge.");
        return;
    }

    try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        document.getElementById("statusAtual").innerText = "ESP32 conectado via USB";
        document.getElementById("statusAtual").className = "normal";

        const decoder = new TextDecoderStream();
        port.readable.pipeTo(decoder.writable);

        const reader = decoder.readable.getReader();
        let buffer = "";

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += value;
            const linhas = buffer.split("\n");
            buffer = linhas.pop();

            for (const linha of linhas) {
                const texto = linha.trim();

                if (texto.startsWith("DB:")) {
                    const valor = parseFloat(texto.replace("DB:", "").trim());

                    if (!isNaN(valor)) {
                        const agora = new Date().toLocaleString("pt-BR");

                        leiturasSerial.unshift({
                            operador: "1",
                            decibeis: valor,
                            data_hora: agora
                        });

                        leiturasSerial = leiturasSerial.slice(0, 30);

                        atualizarDashboard(leiturasSerial);
                    }
                }
            }
        }

    } catch (erro) {
        console.error("Erro ao conectar ESP32:", erro);
        alert("Não foi possível conectar ao ESP32. Feche o Serial Monitor do Arduino e tente de novo.");
    }
}

setInterval(carregarDados, 2000);
carregarDados();

function exportarExcel() {
    const dados = leiturasSerial.length > 0 ? leiturasSerial : [];

    if (dados.length === 0) {
        alert("Ainda não há medições para exportar.");
        return;
    }

    let tabela = `
        <table>
            <tr>
                <th>Horario</th>
                <th>Operador</th>
                <th>Decibeis</th>
                <th>Status</th>
            </tr>
    `;

    dados.forEach(item => {
        const [status] = classificarStatus(item.decibeis);

        tabela += `
            <tr>
                <td>${item.data_hora}</td>
                <td>Operador ${item.operador}</td>
                <td>${item.decibeis.toFixed(1)}</td>
                <td>${status}</td>
            </tr>
        `;
    });

    tabela += `</table>`;

    const arquivo = new Blob([tabela], {
        type: "application/vnd.ms-excel"
    });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(arquivo);
    link.download = "relatorio_ruido.xls";
    link.click();

    URL.revokeObjectURL(link.href);
}

</script>

</body>
</html>
